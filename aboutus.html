<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            text-align: center;
            color: #666;
        }
        .team {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .member {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        .member img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>About Us</h1>
        <p>We are a passionate team dedicated to providing the best service to our customers.</p>
        
        <h2 style="text-align:center;">Meet Our Team</h2>
        <div class="team">
            <div class="member">
                <img src="https://via.placeholder.com/100" alt="Team Member">
                <h3>John Doe</h3>
                <p>Founder & CEO</p>
            </div>
            <div class="member">
                <img src="https://via.placeholder.com/100" alt="Team Member">
                <h3>Jane Smith</h3>
                <p>Chief Designer</p>
            </div>
            <div class="member">
                <img src="https://via.placeholder.com/100" alt="Team Member">
                <h3>Mark Wilson</h3>
                <p>Lead Developer</p>
            </div>
        </div>
    </div>
</body>
</html>
